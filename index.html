
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0e">
<title>PROXY AI.com</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--panel:#111115;--card:#18181e;--text:#f5f5f7;--muted:#92929e;--line:#292930;--red:#ff303b;--soft:#291115}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,sans-serif}
body.light{color-scheme:light;--bg:#f6f6f8;--panel:#fff;--card:#f0f0f3;--text:#17171b;--muted:#70707a;--line:#dedee4;--soft:#ffe9eb}
button,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:19px;letter-spacing:1px}
.logo{width:36px;height:36px;display:grid;place-items:center;background:var(--red);color:white;border-radius:11px;font-weight:900}
.brand em{font-style:normal;color:var(--red)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;text-align:left}
.btn:hover{border-color:var(--red)}
.new{background:var(--red);border-color:var(--red);color:white;font-weight:700;text-align:center}
.section{font-size:11px;color:var(--muted);letter-spacing:1.5px;font-weight:800;margin:5px 0}
.history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.history-item{display:flex;align-items:center;gap:7px}
.history-item button:first-child{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.history-item .active{background:var(--soft);border-color:#70252b}
.del{padding:7px;border:0;background:transparent;color:var(--muted)}
.side-bottom{display:grid;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:10px}
.top-left{display:flex;align-items:center;gap:12px}
.top-title{font-weight:800}
.status{font-size:11px;color:var(--muted)}
.status i{display:inline-block;width:7px;height:7px;background:#35cf86;border-radius:50%;margin-right:5px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.mobile-new{display:none}
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.messages{max-width:850px;margin:auto;padding:30px 22px 20px}
.welcome{text-align:center;padding:12vh 12px 35px}
.welcome-logo{width:65px;height:65px;display:grid;place-items:center;background:var(--soft);border:1px solid #70252b;color:var(--red);border-radius:22px;margin:0 auto 20px;font-size:29px;font-weight:900}
.welcome h1{font-size:clamp(27px,5vw,43px);line-height:1.2;margin:0 0 12px}
.welcome h1 span{color:var(--red)}
.welcome p{color:var(--muted);margin:0 auto 25px;max-width:430px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.suggestion{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:9px 13px;font-size:12px}
.message{display:flex;gap:12px;margin:0 0 28px;align-items:flex-start}
.avatar{width:31px;height:31px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:800}
.message.assistant .avatar{background:var(--red);color:white;border-color:var(--red)}
.content{min-width:0;flex:1;overflow-wrap:anywhere}
.msg-head{font-size:12px;color:var(--muted);margin:3px 0 8px;font-weight:700}
.user-text{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 15px;display:inline-block;white-space:pre-wrap;max-width:100%}
.prose{line-height:1.75}
.prose p{margin:0 0 13px}
.prose h1,.prose h2,.prose h3{line-height:1.35;margin:22px 0 10px}
.prose ul,.prose ol{padding-left:24px}
.prose a{color:var(--red)}
.prose blockquote{margin:12px 0;border-left:3px solid var(--red);padding-left:13px;color:var(--muted)}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;width:100%;margin:12px 0}
.prose td,.prose th{border:1px solid var(--line);padding:8px;text-align:left}
.prose :not(pre)>code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 5px;font-size:.9em}
.prose pre{position:relative;background:#09090c;border:1px solid #303038;border-radius:12px;padding:43px 14px 15px;overflow-x:auto;color:#f4f4f5;line-height:1.55}
.prose pre code{font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}
.code-label{position:absolute;top:0;left:0;right:0;padding:8px 12px;background:#17171d;border-bottom:1px solid #303038;color:#bcbcc5;font-size:11px}
.code-copy{position:absolute;top:5px;right:6px;padding:4px 8px;border:1px solid #42424c;background:#24242b;color:white;border-radius:6px;font-size:11px}
.actions{display:flex;gap:7px;margin-top:10px}
.smallbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted);font-size:11px}
.typing{display:flex;gap:5px;padding:8px 0}
.typing span{width:7px;height:7px;background:var(--red);border-radius:50%;animation:bounce .9s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.25;transform:translateY(-5px)}}
.composer-area{padding:12px 18px 17px;background:linear-gradient(transparent,var(--bg) 16%)}
.composer{max-width:820px;margin:auto;border:1px solid var(--line);background:var(--panel);border-radius:19px;padding:10px;box-shadow:0 10px 35px #0001}
.composer:focus-within{border-color:#963039}
#prompt{display:block;width:100%;resize:none;max-height:180px;min-height:47px;padding:10px 9px;background:transparent;border:0;outline:none;color:var(--text);font-size:15px}
.compose-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 3px 1px}
.hint{font-size:10px;color:var(--muted)}
.send{background:var(--red);color:white;border:0;border-radius:11px;width:42px;height:40px;font-size:20px;font-weight:800}
.send:disabled{opacity:.45;cursor:not-allowed}
.disclaimer{text-align:center;font-size:10px;color:var(--muted);margin-top:9px}
.error{color:#ff737b;font-size:13px;margin-top:8px}
@media(max-width:700px){
 .sidebar{position:fixed;z-index:5;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .22s;box-shadow:12px 0 40px #0005}
 .sidebar.open{transform:translateX(0)}
 .mobile-new{display:block}
 .top{height:58px;padding:0 12px}
 .messages{padding:22px 14px}
 .welcome{padding-top:10vh}
 .composer-area{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
 .hint{max-width:210px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">P</div>PROXY <em>AI</em></div>
 <button class="btn new" id="newChat">＋ &nbsp; Chat Baru</button>
 <div class="section">RIWAYAT CHAT</div>
 <div class="history" id="history"></div>
 <div class="side-bottom">
  <button class="btn" id="themeBtn">☼ &nbsp; Ganti tema</button>
  <div class="status">● PROXY AI</div>
 </div>
</aside>
<main class="main">
 <header class="top">
  <div class="top-left">
   <button class="iconbtn" id="menuBtn" aria-label="Buka menu">☰</button>
   <div><div class="top-title">PROXY AI</div><div class="status"><i></i>AI ONLINE</div></div>
  </div>
  <button class="iconbtn mobile-new" id="mobileNew">＋ CREATE</button>
 </header>
 <div class="scroll" id="scroll">
  <div class="messages" id="messages"></div>
 </div>
 <div class="composer-area">
  <form class="composer" id="chatForm">
   <textarea id="prompt" placeholder="Tanya apa saja ke PROXY AI..." rows="1" maxlength="8000" required></textarea>
   <div class="compose-bottom">
    <span class="hint">Enter untuk kirim · Shift + Enter untuk baris baru</span>
    <button class="send" id="sendBtn" aria-label="Kirim pesan">↑</button>
   </div>
  </form>
  <div class="disclaimer">PROXY AI bisa membuat kesalahan. Periksa informasi penting.</div>
 </div>
</main>
</div>
<script>
marked.setOptions({gfm:true,breaks:true});
const $=id=>document.getElementById(id);
const STORE="lanx_ai_chats_v1",THEME="lanx_ai_theme";
let chats=[],currentId=null,busy=false;
try{chats=JSON.parse(localStorage.getItem(STORE)||"[]");if(!Array.isArray(chats))chats=[]}catch{chats=[]}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(chats.slice(0,50)))}catch{showError("Penyimpanan penuh. Hapus sebagian riwayat browser.")}}
function current(){return chats.find(c=>c.id===currentId)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderMarkdown(text){
 let html=marked.parse(String(text));
 html=DOMPurify.sanitize(html);
 const box=document.createElement("div");box.innerHTML=html;
 box.querySelectorAll("pre").forEach(pre=>{
  const code=pre.querySelector("code");if(!code)return;
  const lang=(code.className.match(/language-([\w+-]+)/)||[])[1]||"code";
  const label=document.createElement("div");label.className="code-label";label.textContent=lang;
  const copy=document.createElement("button");copy.className="code-copy";copy.textContent="Salin kode";
  copy.addEventListener("click",()=>copyText(code.innerText,copy));
  pre.prepend(label);pre.append(copy);
 });
 box.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"});
 return box.innerHTML;
}
async function copyText(text,btn){
 try{await navigator.clipboard.writeText(text);if(btn){let old=btn.textContent;btn.textContent="Tersalin ✓";setTimeout(()=>btn.textContent=old,1200)}}
 catch{const t=document.createElement("textarea");t.value=text;document.body.append(t);t.select();document.execCommand("copy");t.remove();if(btn)btn.textContent="Tersalin ✓"}
}
function showWelcome(){
 $("messages").innerHTML=`<section class="welcome"><div class="welcome-logo">L</div><h1>Halo, bre.<br><span>Mau bikin apa hari ini?</span></h1><p>Teman AI untuk ide, belajar, coding, dan menyelesaikan masalah.</p><div class="suggestions"><button class="suggestion">Buatkan website keren</button><button class="suggestion">Jelaskan JavaScript</button><button class="suggestion">Bantu cari ide project</button><button class="suggestion">Buat kode HTML</button></div></section>`;
 $("messages").querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{$("prompt").value=b.textContent;resizePrompt();$("prompt").focus()});
}
function render(){
 const c=current();$("messages").innerHTML="";
 if(!c||!c.messages.length){showWelcome();return}
 c.messages.forEach((m,i)=>appendMessage(m,i));
 scrollBottom();
}
function appendMessage(m,i){
 const el=document.createElement("article");el.className="message "+m.role;
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=m.role==="assistant"?"L":"K";
 const body=document.createElement("div");body.className="content";
 const head=document.createElement("div");head.className="msg-head";head.textContent=m.role==="assistant"?"LANX AI":"Kamu";
 const text=document.createElement("div");
 if(m.role==="assistant"){text.className="prose";text.innerHTML=renderMarkdown(m.content)}
 else{text.className="user-text";text.textContent=m.content}
 body.append(head,text);
 if(m.role==="assistant"){
  const actions=document.createElement("div");actions.className="actions";
  const copy=document.createElement("button");copy.className="smallbtn";copy.textContent="▢ Salin jawaban";copy.onclick=()=>copyText(m.content,copy);actions.append(copy);body.append(actions);
 }
 el.append(avatar,body);$("messages").append(el);
}
function scrollBottom(){$("scroll").scrollTop=$("scroll").scrollHeight}
function showError(msg){
 const e=document.createElement("div");e.className="error";e.textContent=msg;$("messages").append(e);scrollBottom()
}
function renderHistory(){
 $("history").innerHTML="";
 chats.slice().reverse().forEach(c=>{
  const row=document.createElement("div");row.className="history-item";
  const b=document.createElement("button");b.className="btn"+(c.id===currentId?" active":"");b.textContent="▤  "+(c.title||"Chat baru");b.onclick=()=>{if(busy)return;currentId=c.id;render();renderHistory();closeMenu()};
  const d=document.createElement("button");d.className="del";d.textContent="×";d.title="Hapus chat";d.onclick=()=>{if(busy)return;chats=chats.filter(x=>x.id!==c.id);if(currentId===c.id)currentId=chats.at(-1)?.id||null;save();if(!currentId)newChat();else{render();renderHistory()}};
  row.append(b,d);$("history").append(row)
 });
}
function newChat(){
 if(busy)return;
 const c={id:id(),title:"Chat baru",messages:[]};chats.push(c);currentId=c.id;save();render();renderHistory();$("prompt").value="";resizePrompt();closeMenu()
}
function closeMenu(){$("sidebar").classList.remove("open")}
function resizePrompt(){$("prompt").style.height="auto";$("prompt").style.height=Math.min($("prompt").scrollHeight,180)+"px"}
$("prompt").addEventListener("input",resizePrompt);
$("prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("chatForm").requestSubmit()}});
$("newChat").onclick=newChat;$("mobileNew").onclick=newChat;
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
$("themeBtn").onclick=()=>{
 document.body.classList.toggle("light");
 try{localStorage.setItem(THEME,document.body.classList.contains("light")?"light":"dark")}catch{}
};
try{if(localStorage.getItem(THEME)==="light")document.body.classList.add("light")}catch{}
async function sendMessage(text){
 if(busy||!text.trim())return;
 if(!currentId||!current())newChat();
 const c=current();c.messages.push({role:"user",content:text});
 if(c.messages.filter(m=>m.role==="user").length===1)c.title=text.slice(0,36)+(text.length>36?"…":"");
 save();render();renderHistory();busy=true;$("sendBtn").disabled=true;
 const typing=document.createElement("article");typing.className="message assistant";typing.id="typing";
 typing.innerHTML='<div class="avatar">L</div><div class="content"><div class="msg-head">LANX AI sedang mengetik</div><div class="typing"><span></span><span></span><span></span></div></div>';
 $("messages").append(typing);scrollBottom();
 try{
  const messages=c.messages.slice(-20).map(m=>({role:m.role,content:m.content}));
  const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});
  let data={};try{data=await res.json()}catch{}
  if(!res.ok)throw new Error(data.error||"Permintaan gagal ("+res.status+"). Coba lagi.");
  if(typeof data.reply!=="string")throw new Error("Jawaban AI tidak valid.");
  c.messages.push({role:"assistant",content:data.reply});save();
 }catch(e){showError(e.message||"Gagal menghubungi AI. Periksa koneksi lalu coba lagi.")}
 finally{
  $("typing")?.remove();busy=false;$("sendBtn").disabled=false;render();renderHistory();$("prompt").focus()
 }
}
$("chatForm").addEventListener("submit",e=>{
 e.preventDefault();const t=$("prompt").value.trim();if(!t||busy)return;
 $("prompt").value="";resizePrompt();sendMessage(t)
});
if(!chats.length)newChat();else{currentId=chats.at(-1).id;render();renderHistory()}
</script>
</body>
</html>
